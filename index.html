<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaj — Legal</title>
  <meta name="description" content="Legal documents for Collaj, the privacy-first photo & video collage app." />
  <style>
    :root { --bg:#0a0a0a; --surface:#1c1c1e; --text:#f2f2f7; --muted:#a1a1aa; --accent:#ffcc00; --orange:#ff6b35; }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card { max-width:480px; width:100%; text-align:center; }
    .brand {
      font-weight:800; font-size:40px; letter-spacing:-0.02em;
      background:linear-gradient(90deg,var(--orange),var(--accent));
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    }
    p { color:var(--muted); margin:8px 0 32px; }
    a.link {
      display:block; background:var(--surface); color:var(--text); text-decoration:none;
      padding:16px 20px; border-radius:14px; margin-bottom:12px; font-weight:600;
      transition:background .15s ease;
    }
    a.link:hover { background:#26262a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Collaj</div>
    <p>Photo &amp; Video Collage · Legal</p>
    <a class="link" href="privacy.html">Privacy Policy →</a>
  </div>
</body>
</html>
